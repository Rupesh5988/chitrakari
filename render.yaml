services:
  - type: web
    name: chitrakari-backend
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: PORT
        value: 10000 # Render will automatically override this, but a fallback is good practice
      - key: CLIENT_URL
        sync: false # Set this manually in Render Dashboard after deploying Netlify
